<mat-card class="movie-list-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Lista de filmes</mat-card-title>
  </mat-card-header>

  <mat-card-content class="table-container">
    <table mat-table [dataSource]="movies()" class="mat-elevation-z0">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef style="width: 10%;">Id</th>
        <td mat-cell *matCellDef="let movie">{{ movie.id }}</td>
      </ng-container>

      <!-- Year Column com Filtro -->
      <ng-container matColumnDef="year">
        <th mat-header-cell *matHeaderCellDef style="width: 25%;">
          <div class="header-filter-cell">
            <span class="column-title">Ano</span>
            <mat-form-field appearance="outline" density="compact" subscriptSizing="dynamic">
              <input
                matInput
                type="number"
                placeholder="Filtrar por ano"
                [ngModel]="filterYear()"
                (ngModelChange)="filterYear.set($event); onFilterChange()"
              />
            </mat-form-field>
          </div>
        </th>
        <td mat-cell *matCellDef="let movie">{{ movie.year }}</td>
      </ng-container>

      <!-- Title Column -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef style="width: 45%;">Título</th>
        <td mat-cell *matCellDef="let movie">{{ movie.title }}</td>
      </ng-container>

      <!-- Winner Column com Filtro -->
      <ng-container matColumnDef="winner">
        <th mat-header-cell *matHeaderCellDef style="width: 20%;">
          <div class="header-filter-cell">
            <span class="column-title">Vencedor?</span>
            <mat-form-field appearance="outline" density="compact" subscriptSizing="dynamic">
              <mat-select
                [ngModel]="filterWinner()"
                (ngModelChange)="filterWinner.set($event); onFilterChange()"
              >
                @for (opt of winnerOptions; track opt.value) {
                  <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div>
        </th>
        <td mat-cell *matCellDef="let movie">{{ movie.winner ? 'Sim' : 'Não' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state" colspan="4">Nenhum filme encontrado com os filtros aplicados.</td>
      </tr>
    </table>

    <!-- Paginação oficial do Angular Material -->
    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageIndex]="currentPage()"
      [pageSizeOptions]="[10, 15, 25, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons
      aria-label="Selecionar página de filmes"
    ></mat-paginator>
  </mat-card-content>
</mat-card>
